<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body style="background-color: lightyellow;">
    <header>
        <div class="subscribe">
            <form>
                <input type="email" placeholder="Enter email">
                <button type="submit">Subscribe to my blog</button>

            </form>
        </div>
    </header>

    <div class="menu" onClick = "openArticles()">ALL ARTICLES</div>
    <div class="menu" onClick = "openReviews()">REVIEWS</div>
    <div class="menu" onClick = "openContact()">CONTACT</div>
    <div class="container">
        <h3 class="under_title">Spune-mi si tu ce parere ai despre cele 3 articole ale mele:</h3>
        <form>
            <label>First Name</label>
            <input type="text" placeholder="Your first name...">
            <label>Last Name</label>
            <input type="text" placeholder="Your last name...">
            <label>Country</label>
            <select>
                <option>Romania</option>
                <option>Spania</option>
                <option>Austria</option>
            </select>
            <label>Subject</label>
            <textarea placeholder="Write something..." style="height: 200px;"></textarea>
            <input type="submit" value="submit"></input>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
